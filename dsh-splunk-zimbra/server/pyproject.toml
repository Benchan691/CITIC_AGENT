[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "splunk-zimbra-mcp"
version = "0.1.0"
description = "Unified MCP server for Splunk and Zimbra"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=43,<51",
    "httpx>=0.27,<1",
    "mcp[cli]>=1.28.1,<2",
    "pypdf>=6,<7",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
]

[project.scripts]
unified-mcp-server = "unified_mcp_server.server:main"

[tool.setuptools]
packages = ["unified_mcp_server", "unified_mcp_server.splunk", "unified_mcp_server.zimbra"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["unified_mcp_server/tests"]
