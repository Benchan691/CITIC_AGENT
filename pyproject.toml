[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "splunk-zimbra-mcp"
version = "0.1.0"
description = "Unified MCP server and Deep Agent client for Splunk and Zimbra"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=43,<51",
    "httpx>=0.27,<1",
    "mcp[cli]>=1.28.1,<2",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
agent = [
    "deepagents>=0.7.6,<1",
    "langchain-openai>=1.5,<2",
    "langchain-mcp-adapters>=0.3.2,<1",
]
ui = [
    "deepagents>=0.7.6,<1",
    "langchain-openai>=1.5,<2",
    "langchain-mcp-adapters>=0.3.2,<1",
    "langgraph-cli[inmem]>=0.4.31,<1",
]
test = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
]

[project.scripts]
unified-mcp-server = "unified_mcp_server.server:main"
unified-deep-agent = "unified_mcp_server.deep_agent:main"
unified-dev = "unified_mcp_server.dev:main"

[tool.setuptools]
packages = ["unified_mcp_server", "plugin", "plugin.zimbra", "splunk_mcp"]

[tool.setuptools.package-dir]
splunk_mcp = "splunk-mcp-server2/python"

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
