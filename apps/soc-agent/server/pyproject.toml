[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-agent-mcp"
version = "0.1.0"
description = "SOC Agent MCP server for Zimbra, spreadsheet analysis and subscriptions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=43,<51",
    "httpx>=0.27,<1",
    "markitdown[audio-transcription,docx,outlook,pdf,pptx,xls,xlsx]==0.1.7",
    "mcp>=1.28.1,<2",
    "mcp-excel @ git+https://github.com/jwadow/mcp-excel.git@eb088c5edd5335c67ffc14e521be607a46d49b2a",
    "psycopg[pool,binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
    "zimbra-client>=0.3.4,<0.4",
]

[project.optional-dependencies]
markitdown-llm = [
    "markitdown-ocr[llm]==0.1.0",
    "openai>=1,<2",
]
test = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "pypdf>=6,<7",
]

[project.scripts]
unified-mcp-server = "unified_mcp_server.server:main"

[tool.setuptools]
packages = [
    "unified_mcp_server",
    "unified_mcp_server.zimbra",
    "unified_mcp_server.zimbra.core",
    "unified_mcp_server.zimbra.mail",
    "unified_mcp_server.zimbra.filters",
    "unified_mcp_server.email",
    "unified_mcp_server.spreadsheets",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["unified_mcp_server/tests"]

[tool.setuptools.package-data]
unified_mcp_server = ["migrations/*.sql"]
