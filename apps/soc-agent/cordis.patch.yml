- id: ui-open-in-app
  disabled: true
- id: directory-picker
  disabled: true
- id: subagent
  disabled: true

- id: tools
  config:
    mode: native

- id: agent-loop
  disabled: true
  config:
    maxParallelToolCalls: 4

- id: approval
  config:
    policy: ask

- id: compaction-basic
  disabled: false
- id: command-compact
  disabled: false
- id: tool-result-pruner
  disabled: true
- id: agent-instructions
  disabled: true

# AGENTS.md / CLAUDE.md loading needs the fs provider (not model tools).
- id: sandbox-policy
  disabled: false
- id: fs-sandbox
  disabled: false

# Preset roster owns persona + agent-instructions for standard sessions.
- id: agent-presets
  disabled: false
  config:
    default: citic-soc
    roots:
      - path: !!js "(process.env.MCP_SERVER_ROOT ?? process.env.MCP_SEVER_ROOT ?? process.cwd().split('/vendor/deepseek-harness')[0]) + '/apps/soc-agent/agent-presets'"
        trust: system
    includeShippedRoot: true
    includeUserRoot: true

- id: skill
  disabled: false
- id: skill-filesystem
  disabled: false
  config:
    customSkillDirs:
      - !!js "(process.env.MCP_SERVER_ROOT ?? process.env.MCP_SEVER_ROOT ?? process.cwd().split('/vendor/deepseek-harness')[0]) + '/skills'"
- id: tool-skill
  disabled: false
- id: ui-skill
  disabled: false

