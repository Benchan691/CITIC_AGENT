# ── UI surface ──────────────────────────────────────────────────────────────

- id: hmr
  disabled: false
- id: client-hmr
  disabled: false
# The corresponding host runner is disabled for this product, so leave its
# browser half out too; otherwise fixture and production clients repeatedly
# attempt an unavailable dynamicCordisRunner RPC during boot.
- id: cordis-client-runner
  disabled: true
- id: user-questions
  disabled: false
- id: plugin-inventory
  disabled: false
- id: ui-settings-plugin-inventory
  disabled: false
- id: ui-settings-plugins
  disabled: false

# Provider configuration is available from the local /admin surface. The
# regular settings modal does not mount the provider editor.
- id: ui-settings-models
  disabled: true

- id: session-folders
  disabled: true

# The upstream shell is intentionally disabled for the SOC product. The
# isolated replacements below own the same standard slots and keep this
# checkout's current UI behavior stable while Harness continues iterating.
- id: ui-sidebar
  disabled: true
- id: ui-workspace
  disabled: true

- id: ui-cordis
  disabled: true
- id: ui-workflow-run
  disabled: true
- id: ui-deliverables
  disabled: true
- id: ui-subagent
  disabled: true
- id: ui-jobs
  disabled: true
- id: ui-goal
  disabled: true
- id: ui-message-feedback
  disabled: true
- id: ui-permission
  disabled: true
- id: ui-agent-preset
  disabled: true
- id: ui-plan
  disabled: false
- id: ui-user-questions
  disabled: false
- id: ui-trajectory
  disabled: true
# The auxiliary session-title LLM is redundant: the deterministic session-title
# fallback names sessions without a generation request on every conversation.
- id: session-title-llm
  disabled: true

# ── SOC product plugins ─────────────────────────────────────────────────────

- insert:
    - id: soc-agent-api-gateway
      name: dsh-soc-agent-api-gateway
    - id: soc-agent-agent
      name: dsh-soc-agent-agent
    - id: soc-agent-agent-loop
      name: dsh-soc-agent-agent-loop
      config:
        agents: []
        maxParallelToolCalls: 4
    - id: soc-agent-settings-file
      name: dsh-soc-agent-settings-file
    - id: soc-agent-llm-pi-ai
      name: dsh-soc-agent-llm-pi-ai
    - id: soc-agent-session-persistence-jsonl
      name: dsh-soc-agent-session-persistence-jsonl
      config:
        root: !!js dshHomePath('sessions')
    - id: soc-agent-time-context
      name: dsh-soc-agent-time-context
    - id: soc-agent-connection
      name: dsh-soc-agent-connection
      inject: [webRuntime, socAuth]
      config:
        trustedHosts: !!js ctx.webRuntime.trustedHosts
    - id: soc-agent-file-upload
      name: dsh-soc-agent-file-upload
    - id: soc-agent-api-remotes
      name: dsh-soc-agent-api-remotes
    - id: soc-agent-session-controller
      name: dsh-soc-agent-session-controller
      inject: [socAuth]
    - id: soc-agent-workspace-controller
      name: dsh-soc-agent-workspace-controller
      inject: [socAuth]
    - id: soc-agent-workspace-files
      name: dsh-soc-agent-api-workspace-files
      inject: [socAuth]
    - id: soc-agent-settings-controller
      name: dsh-soc-agent-api-settings-controller
      inject: [socAuth]
    - id: soc-agent-session-log-export
      name: dsh-soc-agent-session-log-export
      inject: [socAuth]
    - id: soc-agent-mcp
      name: dsh-soc-agent-mcp-client
      config:
        serverName: soc_agent
        transport: stdio
        command: uv
        args: ['run', 'unified-mcp-server']
        cwd: !!js "process.env.DSH_SOC_AGENT_SERVER ?? ((process.env.MCP_SERVER_ROOT ?? process.env.MCP_SEVER_ROOT ?? process.cwd().split('/vendor/deepseek-harness')[0]) + '/apps/soc-agent/server')"
        env:
          MCP_SERVER_ROOT: !!js "process.env.MCP_SERVER_ROOT ?? process.env.MCP_SEVER_ROOT ?? process.cwd().split('/vendor/deepseek-harness')[0]"
          APP_POSTGRES_URI: !!js "process.env.APP_POSTGRES_URI || process.env.LANGGRAPH_POSTGRES_URI || process.env.POSTGRES_URI || ''"
          APP_SETTINGS_ENCRYPTION_KEY: !!js process.env.APP_SETTINGS_ENCRYPTION_KEY ?? ''
          SOC_EVIDENCE_STORE: !!js "process.env.SOC_EVIDENCE_STORE ?? ((process.env.DSH_HOME ?? process.env.HOME + '/.dsh') + '/soc-evidence.sqlite3')"
        allowedToolNames:
          - zimbra_list_folders
          - zimbra_list_signatures
          - zimbra_create_signature
          - zimbra_delete_signature
          - zimbra_create_folder
          - zimbra_search_emails
          - zimbra_get_email
          - zimbra_get_email_headers
          - zimbra_get_attachment_text
          - zimbra_send_email
          - zimbra_forward_email
          - zimbra_use_signature_on_email
          - zimbra_move_email
          - zimbra_list_email_filters
          - zimbra_get_email_filter
          - zimbra_validate_email_filter
          - zimbra_preview_email_filter_update
          - zimbra_create_email_filter
          - zimbra_update_email_filter
          - zimbra_delete_email_filter
          - zimbra_set_email_filter_enabled
          - zimbra_reorder_email_filter
          - list_subscriptions
          - get_subscription_schema
          - preview_subscription
          - create_subscription
          - update_subscription
          - delete_subscription
        # One 180-second end-to-end operation budget plus cleanup margin; the
        # MCP transport deadline is derived from it (see redesign plan, §6).
        toolCallTimeoutMs: 185000
        failOnStartupError: true
    - id: splunk-official-mcp
      name: dsh-soc-agent/splunk-bridge
      description: Conditional direct bridge for the official read-only Splunk MCP tools.
    - id: soc-agent-auth-host
      name: dsh-soc-agent/auth-host
      description: Zimbra-backed application login and server-side workspace ownership boundary.
    - id: soc-agent-admin-host
      name: dsh-soc-agent/host
      description: Host policy, tool allowlists, and admin RPC for the SOC Agent product.
    - id: soc-agent-client-core
      name: dsh-soc-agent-client
      disabled: false
      description: Mandatory SOC client runtime, authentication gate, and policy contract.
    - id: soc-agent-ui-layout
      name: dsh-soc-agent-ui-layout
      disabled: false
    - id: soc-agent-ui-renderer
      name: dsh-soc-agent-ui-renderer
      disabled: false
    - id: soc-agent-ui-session
      name: dsh-soc-agent-ui-session
      disabled: false
    - id: soc-agent-sidebar-ui
      name: dsh-soc-agent-sidebar
      disabled: false
      description: Isolated SOC sidebar shell and slot contract.
    - id: soc-agent-workspace-ui
      name: dsh-soc-agent-workspace
      disabled: false
      description: Isolated SOC workspace and session browser.
    - id: soc-agent-ui-conversation
      name: dsh-soc-agent-ui-conversation
      disabled: false
    - id: soc-agent-auto-collapse
      name: dsh-soc-agent-auto-collapse
      disabled: false
      description: Optional native compact transcript behavior.
    - id: soc-agent-ui-chat
      name: dsh-soc-agent-ui-chat
      disabled: false
    - id: soc-agent-ui-approval
      name: dsh-soc-agent-ui-approval
      disabled: false
    - id: soc-agent-ui-commands
      name: dsh-soc-agent-ui-commands
      disabled: false
    - id: soc-agent-ui-input-trigger
      name: dsh-soc-agent-ui-input-trigger
      disabled: false
    - id: soc-agent-ui-model-selection
      name: dsh-soc-agent-ui-model-selection
      disabled: false
    - id: soc-agent-brand-ui
      name: dsh-soc-agent-brand
      disabled: false
      description: Optional CITIC/Sentinel branding for sidebar and conversation surfaces.
    - id: soc-agent-admin-ui
      name: dsh-soc-agent-admin
      disabled: false
      description: Optional SOC administration console.
    - id: soc-agent-action-policy-ui
      name: dsh-soc-agent-action-policy
      disabled: false
      description: Optional end-user access-mode selector.
    - id: soc-agent-attachments-ui
      name: dsh-soc-agent-attachments
      disabled: false
      description: Optional MarkItDown document attachment feature.
    - id: soc-agent-email-draft-ui
      name: dsh-soc-agent-email-draft
      disabled: false
      description: Optional editable Zimbra email draft tool views.
