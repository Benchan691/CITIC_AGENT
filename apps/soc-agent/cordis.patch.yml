# SOC Agent product patch over dsh-base + dsh-web-app.
# Keep coding tools off; keep fs provider on so agent-instructions can load
# $DSH_HOME/AGENTS.md. Model-facing fs/shell tools stay disabled below.

# Every implementation forked for the SOC boundary is disabled in the
# pristine rc.2 graph. Replacements below use distinct ids so rollback remains
# an explicit configuration change and duplicate owners are mechanically visible.
- id: typert-gateway
  disabled: true
- id: agent
  disabled: true
- id: settings
  disabled: true
- id: llm-pi-ai
  disabled: true
- id: session-persistence-jsonl
  disabled: true
- id: connection
  disabled: true
- id: file-upload
  disabled: true
- id: api-remotes
  disabled: true
- id: session-controller
  disabled: true
- id: workspace-controller
  disabled: true
- id: workspace-files
  disabled: true
- id: settings-controller
  disabled: true
- id: session-log-download
  disabled: true
- id: time-context
  disabled: true
- id: mcp-client
  disabled: true
- id: ui-layout
  disabled: true
- id: ui-renderer
  disabled: true
- id: ui-session
  disabled: true
- id: ui-conversation
  disabled: true
- id: ui-chat
  disabled: true
- id: ui-approval
  disabled: true
- id: ui-commands
  disabled: true
- id: ui-input-trigger
  disabled: true
- id: ui-model-selection
