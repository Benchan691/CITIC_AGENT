# SOC Agent product patch over dsh-base + dsh-web-app.
# Keep coding tools off; keep fs provider on so agent-instructions can load
# $DSH_HOME/AGENTS.md. Model-facing fs/shell tools stay disabled below.

- id: tools
  config:
    mode: native

- id: approval
  config:
    policy: ask

- id: compaction-basic
  disabled: false
- id: command-compact
  disabled: false
- id: tool-result-pruner
  disabled: false

# AGENTS.md / CLAUDE.md loading needs the fs provider (not model tools).
- id: sandbox-policy
  disabled: false
- id: fs-sandbox
  disabled: false

# Preset roster owns persona + agent-instructions for standard sessions.
- id: agent-presets
  disabled: false

- id: skill
  disabled: false
- id: skill-filesystem
  disabled: false
  config:
    customSkillDirs:
      - !!js "(process.env.MCP_SERVER_ROOT ?? process.env.MCP_SEVER_ROOT ?? process.cwd().split('/vendor/deepseek-harness')[0]) + '/skills'"
- id: tool-skill
  disabled: false
- id: ui-skill
  disabled: false

