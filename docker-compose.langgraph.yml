services:
  langgraph-api:
    environment:
      # The MCP server is started by unified-dev on the host machine. This
      # value is intentionally only for the Docker-backed Agent Server.
      MCP_SERVER_URL: http://host.docker.internal:8050/mcp
      # unified-dev rewrites localhost to host.docker.internal before launch.
      APP_POSTGRES_URI: ${APP_POSTGRES_URI_DOCKER:-}
      LANGGRAPH_POSTGRES_URI: ${LANGGRAPH_POSTGRES_URI:-}
      POSTGRES_URI: ${POSTGRES_URI:-}
      APP_SETTINGS_ENCRYPTION_KEY: ${APP_SETTINGS_ENCRYPTION_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
