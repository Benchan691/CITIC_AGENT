- insert:
    - id: soc-agent-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: soc_agent
        transport: stdio
        command: uv
        args: ['run', 'unified-mcp-server']
        cwd: !!js "process.env.DSH_SOC_AGENT_SERVER ?? ((process.env.MCP_SEVER_ROOT ?? (process.cwd().endsWith('deepseek-harness') ? process.cwd().slice(0, -17) : process.cwd())) + '/dsh-soc-agent/server')"
        env:
          MCP_SEVER_ROOT: !!js "process.env.MCP_SEVER_ROOT ?? (process.cwd().endsWith('deepseek-harness') ? process.cwd().slice(0, -17) : process.cwd())"
          APP_POSTGRES_URI: !!js process.env.APP_POSTGRES_URI ?? ''
          APP_SETTINGS_ENCRYPTION_KEY: !!js process.env.APP_SETTINGS_ENCRYPTION_KEY ?? ''
        toolCallTimeoutMs: 120000
        failOnStartupError: true
    - id: soc-agent-admin-host
      name: dsh-soc-agent/host
      description: Host policy, tool allowlists, and admin RPC for the SOC Agent product.
    - id: soc-agent-scheduler
      name: dsh-soc-agent/scheduler
      description: Durable scheduled read-only Splunk and Zimbra investigation runs.
      config:
        workspaceRoot: !!js "process.env.MCP_SEVER_ROOT ?? (process.cwd().endsWith('deepseek-harness') ? process.cwd().slice(0, -17) : process.cwd())"
        maxConcurrentRuns: 1
        runTimeoutMs: 900000
    - id: soc-agent-admin-ui
      name: dsh-soc-agent-client
