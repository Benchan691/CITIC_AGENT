<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" role="img" aria-labelledby="t d">
<title id="t">System context diagram</title>
<desc id="d">Analysts and administrators connect over HTTPS to the SOC Agent system, which talks to Zimbra, an external official Splunk MCP server, a subscription service, PostgreSQL, and an LLM provider. Splunk access is read-only over an authenticated bridge.</desc>
