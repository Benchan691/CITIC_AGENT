<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" role="img" aria-labelledby="t d">
<title id="t">MCP routing diagram</title>
<desc id="d">Tool calls from the model pass the raw allowlists at registration, then the host policy gate, then mode and per-tool state. Read tools auto-run, mutations ask through the fail-closed approval waterfall, disabled tools are denied. Splunk results pass the projection. The ui-confirmed send entry is not a tool.</desc>
<style>a[data-node] rect, a[data-node] ellipse { transition: stroke-width .15s; } a[data-node]:hover rect, a[data-node]:hover ellipse, a[data-node]:focus rect, a[data-node]:focus ellipse { stroke-width: 3; }</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="980" height="600" fill="#ffffff"/>
