ont-size="12.5" fill="#1f2937">mode: full / soc</text><text x="510" y="372.5" text-anchor="middle" font-size="12.5" fill="#1f2937">+ per-tool ask/auto/disabled</text></a><a href="security.html#residual" data-node="dn" style="cursor:pointer"><rect x="700" y="200" width="200" height="55" rx="8" fill="#fde8e8" stroke="#b91c1c" stroke-width="1.5"/><text x="800" y="232.5" text-anchor="middle" font-size="12.5" fill="#1f2937">deny (fail closed)</text></a><a href="security.html#decision" data-node="ap" style="cursor:pointer"><rect x="700" y="300" width="200" height="70" rx="8" fill="#fdf4ff" stroke="#a21caf" stroke-width="1.5"/><text x="800" y="332.5" text-anchor="middle" font-size="12.5" fill="#1f2937">approval waterfall</text><text x="800" y="347.5" text-anchor="middle" font-size="12.5" fill="#1f2937">(fail-closed ask)</text></a><a href="flows.html#splunkflow" data-node="run" style="cursor:pointer"><rect x="700" y="410" width="200" height="55" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/><text x="800" y="442.5" text-anchor="middle" font-size="12.5" fill="#1f2937">execute</text></a><a href="security.html#controls" data-node="pr" style="cursor:pointer"><rect x="400" y="450" width="220" height="70" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/><text x="510" y="482.5" text-anchor="middle" font-size="12.5" fill="#1f2937">projection: mask PII,</text><text x="510" y="497.5" text-anchor="middle" font-size="12.5" fill="#1f2937">truncate 50KB (splunk only)</text></a><a href="index.html#product" data-node="mo" style="cursor:pointer"><ellipse cx="160" cy="485" rx="100" ry="35" fill="#e0e7ff" stroke="#3730a3" stroke-width="1.5"/><text x="160" y="490" text-anchor="middle" font-size="12.5" fill="#1f2937">Model</text></a><a href="mcp-tooling.html#anatomy" data-node="ui" style="cursor:pointer"><rect x="30" y="200" width="300" height="60" rx="8" fill="#fde8e8" stroke="#b91c1c" stroke-width="1.5"/><text x="180" y="227.5" text-anchor="middle" font-size="12.5" fill="#1f2937">ui__soc_agent__send_email — NOT a tool</text><text x="180" y="242.5" text-anchor="middle" font-size="12.5" fill="#1f2937">human click → send-email RPC</text></a><line x1="330" y1="50" x2="400" y2="50" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/><line x1="330" y1="130" x2="400" y2="130" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/><line x1="510" y1="80" x2="510" y2="200" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/><line x1="510" y1="160" x2="510" y2="200" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/><line x1="620" y1="240" x2="700" y2="227.5" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/><rect x="620" y="224.75" width="80" height="14" fill="#ffffff" opacity="0.92"/><text x="660" y="235.75" text-anchor="middle" font-size="10.5" fill="#374151">unknown name</text><line x1="510" y1="280" x2="510" y2="320" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/><line x1="620" y1="360" x2="700" y2="227.5" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/><rect x="632" y="284.75" width="56" height="14" fill="#ffffff" opacity="0.92"/><text x="660" y="295.75" text-anchor="middle" font-size="10.5" fill="#374151">disabled</text><line x1="620" y1="360" x2="700" y2="335" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/><rect x="647" y="338.5" width="26" height="14" fill="#ffffff" opacity="0.92"/><text x="660" y="349.5" text-anchor="middle" font-size="10.5" fill="#374151">ask</text><line x1="620" y1="360" x2="700" y2="437.5" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/><rect x="623" y="389.75" width="74" height="14" fill="#ffffff" opacity="0.92"/><text x="660" y="400.75" text-anchor="middle" font-size="10.5" fill="#374151">auto / full</text><line x1="800" y1="410" x2="510" y2="160" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/><line x1="800" y1="410" x2="510" y2="80" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/><line x1="510" y1