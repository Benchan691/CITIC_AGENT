<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-labelledby="t d">
<title id="t">Authentication sequence</title>
<desc id="d">Login posts credentials to the Node host, which verifies them against Zimbra through Python and creates a Postgres session with an encrypted token, revoking older sessions. Later requests carry server-resolved identity and MCP metadata. Invalid credentials, expired sessions, and cross-site requests are denied.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="960" height="620" fill="#ffffff"/>
<ellipse cx="130" cy="60" rx="100" ry="30" fill="#e0e7ff" stroke="#3730a3" stroke-width="1.5"/><text x="130" y="65" text-anchor="middle" font-size="12.5" fill="#1f2937">Browser</text><rect x="320" y="30" width="240" height="60" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/><text x="440" y="57.5" text-anchor="middle" font-size="12.5" fill="#1f2937">Node host (ownership.js)</text><text x="440" y="72.5" text-anchor="middle" font-size="12.5" fill="#1f2937">same-site check, 32KiB cap</text><rect x="640" y="30" width="240" height="60" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/><text x="760" y="65" text-anchor="middle" font-size="12.5" fill="#1f2937">auth_cli / control_server</text><rect x="640" y="140" width="240" height="55" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/><text x="760" y="172.5" text-anchor="middle" font-size="12.5" fill="#1f2937">Zimbra (SOAP login)</text><rect x="640" y="240" width="240" height="70" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="760" y="265" text-anchor="middle" font-size="12.5" fill="#1f2937">PostgreSQL</text><text x="760" y="280" text-anchor="middle" font-size="12.5" fill="#1f2937">create_user_session — encrypt token,</text><text x="760" y="295" text-anchor="middle" font-size="12.5" fill="#1f2937">revoke others as new_device_login</text><rect x="320" y="250" width="240" height="70" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/><text x="440" y="282.5" text-anchor="middle" font-size="12.5" fill="#1f2937">200 + soc_session cookie (24h)</text><text x="440" y="297.5" text-anchor="middle" font-size="12.5" fill="#1f2937">replaced sessions aborted</text><rect x="320" y="380" width="240" height="85" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/><text x="440" y="405" text-anchor="middle" font-size="12.5" fill="#1f2937">MCP metadata per call:</text><text x="440" y="420" text-anchor="middle" font-size="12.5" fill="#1f2937">soc_session_id, soc_investigation_id,</text><text x="440" y="435" text-anchor="middle" font-size="12.5" fill="#1f2937">soc_customer_id:'', soc_correlation_id,</text><text x="440" y="450" text-anchor="middle" font-size="12.5" fill="#1f2937">soc_deadline_ms</text><rect x="30" y="250" width="200" height="70" rx="8" fill="#fde8e8" stroke="#b91c1c" stroke-width="1.5"/><text x="130" y="282.5" text-anchor="middle" font-size="12.5" fill="#1f2937">401 invalid email or password</text><text x="130" y="297.5" text-anchor="middle" font-size="12.5" fill="#1f2937">(generic, no echo)</text><rect x="30" y="380" width="200" height="70" rx="8" fill="#fde8e8" stroke="#b91c1c" stroke-width="1.5"/><text x="130" y="412.5" text-anchor="middle" font-size="12.5" fill="#1f2937">session_expired /</text><text x="130" y="427.5" text-anchor="middle" font-size="12.5" fill="#1f2937">authentication_required</text><line x1="230" y1="60" x2="320" y2="60" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/><rect x="223" y="51" width="104" height="14" fill="#ffffff" opacity="0.92"/><text x="275" y="62" text-anchor="middle" font-size="10.5" fill="#374151">POST /auth/login</text><line x1="560" y1="60" x2="640" y2="60" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/><rect x="554" y="51" width="92" height="14" fill="#ffffff" opacity="0.92"/><text x="600" y="62" text-anchor="middle" font-size="10.5" fill="#374151">runAuthCommand</text><line x1="760" y1="90" x2="760" y2="140" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/><line x1="760" y1="90" x2="760" y2="240" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/><line x1="640" y1="60" x2="560" y2="285" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/><rect x="554" y="163.5" width="92" height="14" fill="#ffffff" opacity="0.92"/><text x="600" y="174.5" text-anchor="middle" font-size="10.5" fill="#374151">public_session</text><line x1="320" y1="60" x2="230" y2="285" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/><rect x="241" y="163.5" width="68" height="14" fill="#ffffff" opacity="0.92"/><text x="275" y="174.5" text-anchor="middle" font-size="10.5" fill="#374151">on failure</text><line x1="440" y1="320" x2="440" y2="380" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/><rect x="403" y="341" width="74" height="14" fill="#ffffff" opacity="0.92"/><text x="440" y="352" text-anchor="middle" font-size="10.5" fill="#374151">per request</text><line x1="320" y1="422.5" x2="230" y2="415" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/><rect x="226" y="409.75" width="98" height="14" fill="#ffffff" opacity="0.92"/><text x="275" y="420.75" text-anchor="middle" font-size="10.5" fill="#374151">expired/unknown</text></svg>