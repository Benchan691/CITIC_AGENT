<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d">
<title id="t">Runtime containers diagram</title>
<desc id="d">The browser talks to the Node host, which spawns the Python MCP server and control server as stdio children and one-shot admin CLI processes. The host and Python use PostgreSQL; Python reaches Zimbra and the subscription service; the host reaches the external Splunk MCP server as a client.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="960" height="560" fill="#ffffff"/>
<rect x="30" y="40" width="250" height="65" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/><text x="155" y="62.5" text-anchor="middle" font-size="12.5" fill="#1f2937">Browser</text><text x="155" y="77.5" text-anchor="middle" font-size="12.5" fill="#1f2937">harness web runtime +</text><text x="155" y="92.5" text-anchor="middle" font-size="12.5" fill="#1f2937">dsh-soc-agent-client</text><rect x="330" y="30" width="280" height="150" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/><text x="470" y="95" text-anchor="middle" font-size="12.5" fill="#1f2937">Node host process</text><text x="470" y="110" text-anchor="middle" font-size="12.5" fill="#1f2937">cordis plugins: auth-host, host,</text><text x="470" y="125" text-anchor="middle" font-size="12.5" fill="#1f2937">splunk-bridge, mcp-client, connection</text><rect x="680" y="20" width="250" height="90" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/><text x="805" y="62.5" text-anchor="middle" font-size="12.5" fill="#1f2937">Python soc_agent</text><text x="805" y="77.5" text-anchor="middle" font-size="12.5" fill="#1f2937">unified-mcp-server (stdio, 27 tools)</text><rect x="680" y="130" width="250" height="70" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/><text x="805" y="162.5" text-anchor="middle" font-size="12.5" fill="#1f2937">control_server</text><text x="805" y="177.5" text-anchor="middle" font-size="12.5" fill="#1f2937">persistent JSON-line channel</text><rect x="680" y="220" width="250" height="70" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/><text x="805" y="252.5" text-anchor="middle" font-size="12.5" fill="#1f2937">admin_cli</text><text x="805" y="267.5" text-anchor="middle" font-size="12.5" fill="#1f2937">one-shot per admin op</text><rect x="330" y="250" width="185" height="50" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="422.5" y="272.5" text-anchor="middle" font-size="12.5" fill="#1f2937">PostgreSQL</text><text x="422.5" y="287.5" text-anchor="middle" font-size="12.5" fill="#1f2937">soc_* tables + app_config</text><rect x="30" y="250" width="92.6" height="35" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/><text x="76.3" y="272.5" text-anchor="middle" font-size="12.5" fill="#1f2937">Zimbra SOAP</text><rect x="30" y="380" width="250" height="50" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/><text x="155" y="402.5" text-anchor="middle" font-size="12.5" fill="#1f2937">External official Splunk MCP</text><text x="155" y="417.5" text-anchor="middle" font-size="12.5" fill="#1f2937">(streamable HTTP, 13 read tools)</text><rect x="330" y="380" width="152" height="35" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/><text x="406" y="402.5" text-anchor="middle" font-size="12.5" fill="#1f2937">Subscription service</text><line x1="280" y1="72.5" x2="330" y2="105" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/><rect x="271" y="79.75" width="68" height="14" fill="#ffffff" opacity="0.92"/><text x="305" y="90.75" text-anchor="middle" font-size="10.5" fill="#374151">HTTPS + WS</text><line x1="610" y1="105" x2="680" y2="65" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/><rect x="566" y="76" width="158" height="14" fill="#ffffff" opacity="0.92"/><text x="645" y="87" text-anchor="middle" font-size="10.5" fill="#374151">spawn stdio, allowlist 27</text><line x1="610" y1="105" x2="680" y2="165" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/><rect x="575" y="126" width="140" height="14" fill="#ffffff" opacity="0.92"/><text x="645" y="137" text-anchor="middle" font-size="10.5" fill="#374151">spawn stdio JSON lines</text><line x1="610" y1="105" x2="680" y2="255" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/><rect x="599" y="171" width="92" height="14" fill="#ffffff" opacity="0.92"/><text x="645" y="182" text-anchor="middle" font-size="10.5" fill="#374151">spawn one-shot</text><line x1="470" y1="180" x2="422.5" y2="250" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/><line x1="680" y1="65" x2="122.6" y2="267.5" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/><line x1="680" y1="65" x2="482" y2="397.5" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/><line x1="680" y1="65" x2="515" y2="275" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/><line x1="680" y1="165" x2="122.6" y2="267.5" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/><rect x="367.3" y="207.25" width="68" height="14" fill="#ffffff" opacity="0.92"/><text x="401.3" y="218.25" text-anchor="middle" font-size="10.5" fill="#374151">send-email</text><line x1="330" y1="105" x2="280" y2="405" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/><rect x="250" y="246" width="110" height="14" fill="#ffffff" opacity="0.92"/><text x="305" y="257" text-anchor="middle" font-size="10.5" fill="#374151">Bearer, read-only</text></svg>