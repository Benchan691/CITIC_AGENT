<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-labelledby="t d">
<title id="t">Component map</title>
<desc id="d">First-party components: Node plugins (policy, host, auth/ownership, bridge, projection), Python server modules including the retained unregistered Splunk package, the client package with its tracked generated bundle, skills, patch manifests, and the vendored harness they plug into.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
