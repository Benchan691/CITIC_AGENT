<title id="t">Component map</title>
<desc id="d">First-party components: Node plugins, the mandatory SOC client core, isolated sidebar/workspace packages, five optional browser feature packages, Python server modules, skills, patch manifests, and the vendored harness they plug into. All eight SOC browser bundles are tracked and the official sidebar/workspace implementations are disabled.</desc>
