475569" stroke-width="1.4" marker-end="url(#arr)"/><line x1="290" y1="240" x2="400" y2="135" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/><line x1="160" y1="300" x2="160" y2="180" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)" stroke-dasharray="5 4"/><rect x="123" y="231" width="74" height="14" fill="#ffffff" opacity="0.92"/><text x="160" y="242" text-anchor="middle" font-size="10.5" fill="#374151">setup seeds</text><line x1="290" y1="60" x2="400" y2="235" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/><line x1="290" y1="150" x2="400" y2="235" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/><line x1="720" y1="365" x2="640" y2="365" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/><rect x="598" y="356" width="164" height="14" fill="#ffffff" opacity="0.92"/><text x="680" y="367" text-anchor="middle" font-size="10.5" fill="#374151">settings.mutate + revision</text><line x1="520" y1="320" x2="520" y2="270" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/><line x1="640" y1="135" x2="720" y2="135" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/><line x1="640" y1="235" x2="720" y2="135" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/><line x1="335" y1="420" x2="520" y2="170" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/><line x1="335" y1="420" x2="520" y2="270" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/></svg>