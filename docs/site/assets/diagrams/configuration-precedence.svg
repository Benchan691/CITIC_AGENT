<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d">
<title id="t">Configuration precedence</title>
<desc id="d">Process environment wins over the server env file, which wins over the workspace env file. The example file is only a template. Admin-editable runtime settings live encrypted in Postgres and never include service endpoints. Fallback chains are explicit.</desc>
<style>a[data-node] rect, a[data-node] ellipse { transition: stroke-width .15s; } a[data-node]:hover rect, a[data-node]:hover ellipse, a[data-node]:focus rect, a[data-node]:focus ellipse { stroke-width: 3; }</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="960" height="560" fill="#ffffff"/>
