<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" width="980" height="480" role="img" aria-labelledby="t d">
<title id="t">Email draft and send state machine</title>
<desc id="d">The model creates a local draft; nothing is stored or sent. The draft card moves from editing through an explicit confirmation to sending, and only a Zimbra confirmed sent acknowledgment marks success. Discarded drafts can be reopened; failures can be retried.</desc>
<style>a[data-node] rect, a[data-node] ellipse { transition: stroke-width .15s; } a[data-node]:hover rect, a[data-node]:hover ellipse, a[data-node]:focus rect, a[data-node]:focus ellipse { stroke-width: 3; }</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="980" height="480" fill="#ffffff"/>
<a href="mcp-tooling.html#anatomy" data-node="st" style="cursor:pointer"><rect x="20" y="40" width="240" height="70" rx="8" fill="#fdf4ff" stroke="#a21caf" stroke-width="1.5"/><text x="140" y="72.5" text-anchor="middle" font-size="12.5" fill="#1f2937">zimbra_send_email tool result:</text><text x="140" y="87.5" text-anchor="middle" font-size="12.5" fill="#1f2937">LOCAL draft — no store, no send</text></a><a href="flows.html#ui" data-node="ed" style="cursor:pointer"><rect x="310" y="40" width="220" height="70" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/><text x="420" y="65" text-anchor="middle" font-size="12.5" fill="#1f2937">editing</text><text x="420" y="80" text-anchor="middle" font-size="12.5" fill="#1f2937">edit fields · add signature</text><text x="420" y="95" text-anchor="middle" font-size="12.5" fill="#1f2937">(list-signatures)</text></a><a href="flows.html#emailflow" data-node="di" style="cursor:pointer"><rect x="310" y="170" width="220" height="60" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/><text x="420" y="197.5" text-anchor="middle" font-size="12.5" fill="#1f2937">discarded</text><text x="420" y="212.5" text-anchor="middle" font-size="12.5" fill="#1f2937">(Reopen available)</text></a><a href="flows.html#emailflow" data-node="se" style="cursor:pointer"><rect x="590" y="30" width="190" height="90" rx="8" fill="#fdf4ff" stroke="#a21caf" stroke-width="1.5"/><text x="685" y="65" text-anchor="middle" font-size="12.5" fill="#1f2937">validation +</text><text x="685" y="80" text-anchor="middle" font-size="12.5" fill="#1f2937">window.confirm</text><text x="685" y="95" text-anchor="middle" font-size="12.5" fill="#1f2937">('Send this email now?')</text></a><a href="flows.html#emailflow" data-node="sn" style="cursor:pointer"><rect x="830" y="40" width="130" height="60" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/><text x="895" y="75" text-anchor="middle" font-size="12.5" fill="#1f2937">sending</text></a><a href="mcp-tooling.html#servers" data-node="do" style="cursor:pointer"><rect x="830" y="170" width="130" height="70" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/><text x="895" y="202.5" text-anchor="middle" font-size="12.5" fill="#1f2937">send-email RPC</text><text x="895" y="217.5" text-anchor="middle" font-size="12.5" fill="#1f2937">→ ZIMBRA_ALLOW_SEND</text></a><a href="flows.html#emailflow" data-node="ok" style="cursor:pointer"><rect x="590" y="260" width="190" height="60" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/><text x="685" y="295" text-anchor="middle" font-size="12.5" fill="#1f2937">sent (sent === true)</text></a><a href="troubleshooting.html#areas" data-node="fa" style="cursor:pointer"><rect x="310" y="260" width="220" height="70" rx="8" fill="#fde8e8" stroke="#b91c1c" stroke-width="1.5"/><text x="420" y="285" text-anchor="middle" font-size="12.5" fill="#1f2937">failed</text><text x="420" y="300" text-anchor="middle" font-size="12.5" fill="#1f2937">"Zimbra did not confirm that</text><text x="420" y="315" text-anchor="middle" font-size="12.5" fill="#1f2937">the email was sent." (Retry)</text></a><line x1="260" y1="75" x2="310" y2="75" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/><line x1="420" y1="110" x2="420" y2="170" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/><rect x="395" y="131" width="50" height="14" fill="#ffffff" opacity="0.92"/><text x="420" y="142" text-anchor="middle" font-size="10.5" fill="#374151">discard</text><line x1="420" y1="170" x2="420" y2="110" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)" stroke-dasharray="5 4"/><rect x="398" y="131" width="44" height="14" fill="#ffffff" opacity="0.92"/><text x="420" y="142" text-anchor="middle" font-size="10.5" fill="#374151">reopen</text><line x1="530" y1="75" x2="590" y2="75" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/><rect x="544" y="66" width="32" height="14" fill="#ffffff" opacity="0.92"/><text x="560" y="77" text-anchor="middle" font-size="10.5" fill="#374151">send</text><line x1="780" y1="75" x2="830" y2="70" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/><rect x="774" y="63.5" width="62" height="14" fill="#ffffff" opacity="0.92"/><text x="805" y="74.5" text-anchor="middle" font-size="10.5" fill="#374151">confirmed</text><line x1="895" y1="100" x2="895" y2="170" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/><line x1="830" y1="205" x2="780" y2="290" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/><rect x="774" y="238.5" width="62" height="14" fill="#ffffff" opacity="0.92"/><text x="805" y="249.5" text-anchor="middle" font-size="10.5" fill="#374151">sent:true</text><line x1="830" y1="205" x2="530" y2="295" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/><rect x="619" y="241" width="122" height="14" fill="#ffffff" opacity="0.92"/><text x="680" y="252" text-anchor="middle" font-size="10.5" fill="#374151">error / missing ack</text><line x1="530" y1="295" x2="590" y2="75" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)" stroke-dasharray="5 4"/><rect x="541" y="176" width="38" height="14" fill="#ffffff" opacity="0.92"/><text x="560" y="187" text-anchor="middle" font-size="10.5" fill="#374151">retry</text></svg>