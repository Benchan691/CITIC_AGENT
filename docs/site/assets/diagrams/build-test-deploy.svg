<title id="t">Build, test, and deploy lifecycle</title>
<desc id="d">Canonical sources flow through builds (client bundle tracked in Git, harness fingerprint-gated) and offline tests into setup wiring, which maintains the harness profile. Deployment starts the Node host on port 3080. The update path is a clean-tree fast-forward followed by the repair pass and a manual restart.</desc>
<style>a[data-node] rect, a[data-node] ellipse { transition: stroke-width .15s; } a[data-node]:hover rect, a[data-node]:hover ellipse, a[data-node]:focus rect, a[data-node]:focus ellipse { stroke-width: 3; }</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="980" height="480" fill="#ffffff"/>
