ke-width="1.5"/><text x="145" y="330" text-anchor="middle" font-size="12.5" fill="#1f2937">PostgreSQL</text><text x="145" y="345" text-anchor="middle" font-size="12.5" fill="#1f2937">sessions (encrypted token),</text><text x="145" y="360" text-anchor="middle" font-size="12.5" fill="#1f2937">ownership, app_config (Fernet)</text></a><a href="security.html#auth" data-node="ws" style="cursor:pointer"><rect x="330" y="300" width="230" height="70" rx="8" fill="#fde8e8" stroke="#b91c1c" stroke-width="1.5"/><text x="445" y="332.5" text-anchor="middle" font-size="12.5" fill="#1f2937">.data/soc-workspaces/&lt;userId&gt;/</text><text x="445" y="347.5" text-anchor="middle" font-size="12.5" fill="#1f2937">per-user artifacts</text></a><a href="operations.html#config" data-node="ev" style="cursor:pointer"><rect x="620" y="300" width="210" height="60" rx="8" fill="#fde8e8" stroke="#b91c1c" stroke-width="1.5"/><text x="725" y="335" text-anchor="middle" font-size="12.5" fill="#1f2937">.env files (0600) — secrets</text></a><a href="mcp-tooling.html#servers" data-node="ex" style="cursor:pointer"><rect x="330" y="440" width="420" height="70" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/><text x="540" y="472.5" text-anchor="middle" font-size="12.5" fill="#1f2937">External: Zimbra (SOAP as user) · external Splunk MCP (Bearer)</text><text x="540" y="487.5" text-anchor="middle" font-size="12.5" fill="#1f2937">· subscription (service login) · LLM provider</text></a><line x1="260" y1="60" x2="330" y2="100" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/><line x1="260" y1="140" x2="330" y2="100" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/><line x1="560" y1="100" x2="650" y2="100" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/><line x1="560" y1="215" x2="650" y2="100" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/><line x1="445" y1="250" x2="540" y2="440" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/><rect x="419.5