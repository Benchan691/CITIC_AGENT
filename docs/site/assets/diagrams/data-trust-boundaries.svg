<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" role="img" aria-labelledby="t d">
<title id="t">Data and trust boundaries</title>
<desc id="d">Untrusted retrieved content from mail and Splunk crosses sanitization and truncation before reaching the model. Sensitive stores are the Postgres session and configuration tables, per-user workspaces, and the environment secret files. External systems receive only credential-scoped calls.</desc>
