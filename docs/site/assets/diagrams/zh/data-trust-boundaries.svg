<title id="t">数据与信任边界图</title>
<desc id="d">不可信的邮件与 Splunk 内容先经脱敏与截断再进入模型。敏感存储为 Postgres 会话与配置表、按用户工作区与环境机密文件。外部系统只收到凭据限定的调用。</desc>
