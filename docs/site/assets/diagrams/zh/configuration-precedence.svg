<title id="t">配置优先级图</title>
<desc id="d">进程环境优先于服务器 env 文件，后者优先于工作区 env 文件；示例文件只是模板。管理可编辑的运行时设置加密存于 Postgres，绝不包含服务端点。回退链明确。</desc>
