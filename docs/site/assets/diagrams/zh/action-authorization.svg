<title id="t">动作授权决策树</title>
<desc id="d">请求的工具必须通过注册、宿主允许列表、模式与每工具状态、审批或自动执行，再到 Python 侧门控。邮件投递是单独的仅人工路径，需要界面确认。</desc>
