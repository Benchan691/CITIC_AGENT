<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d">
<title id="t">运行时容器图</title>
<desc id="d">浏览器加载八个 SOC bundle 并连到 Node 宿主；宿主把 Python MCP 服务器与控制服务器作为 stdio 子进程拉起，并按需拉起一次性管理 CLI 子进程；宿主与 Python 使用 PostgreSQL；Python 访问 Zimbra 与订阅服务；宿主作为客户端访问外部 Splunk MCP 服务器。</desc>
<style>a[data-否de] rect, a[data-否de] ellipse { transition: stroke-width .15s; } a[data-否de]:hover rect, a[data-否de]:hover ellipse, a[data-否de]:focus rect, a[data-否de]:focus ellipse { stroke-width: 3; }</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="960" height="560" fill="#ffffff"/>
