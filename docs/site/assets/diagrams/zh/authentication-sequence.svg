<title id="t">认证时序图</title>
<desc id="d">登录经 Node 宿主由 Zimbra 通过 Python 验证，在 Postgres 创建加密令牌会话并撤销其他会话。后续请求携带服务端解析的身份与 MCP 元数据。无效凭据、过期会话与跨站请求被拒绝。</desc>
