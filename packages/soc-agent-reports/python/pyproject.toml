[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-agent-reports"
version = "0.1.0"
description = "Reusable validated customer report generation for DSH"
requires-python = ">=3.12"
dependencies = ["Jinja2>=3.1,<4", "pypdf>=6,<7", "playwright>=1.48,<2", "XlsxWriter>=3.2,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
soc_agent_reports = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
