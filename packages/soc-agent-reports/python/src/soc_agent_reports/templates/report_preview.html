<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <!--
  ASSEMBLY INSTRUCTIONS
  Insert the completed Executive Summary and Security Analysis fragments in
  their matching sections below. Follow the paragraph/theme writing instructions
  embedded in executive_summary.html and security_analysis.html. Keep this CSS
  and section order. The preview reproduces these two report sections; Splunk
  supplies the other monthly-report pages and Zimbra news. A filled report
  must contain finished prose, not writing instructions or placeholders.
  -->
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #e9e9e9; color: #000; font: 14px/1.5 Arial, sans-serif; }
    main { width: 8.5in; max-width: 100%; margin: 28px auto; }
    section { min-height: 11in; padding: 0.57in; background: #fff; }
    section + section { margin-top: 24px; }
    h1 { margin: 0 0 10px; font-size: 20px; font-weight: 700; line-height: 1.25; }
    h2 { margin: 28px 0 12px; font-size: 14pt; font-weight: 700; line-height: 1.2; }
    h1, h2, h3 { break-after: avoid; page-break-after: avoid; }
    p { margin: 0 0 12px; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 8.5pt; line-height: 1.25; }
    th, td { border: 1px solid #000; padding: 3px 5px; vertical-align: top; overflow-wrap: anywhere; }
    th { text-align: center; font-weight: 700; background: #fff; }
    th:nth-child(1) { width: 20%; }
    th:nth-child(2) { width: 10%; }
    th:nth-child(3) { width: 22%; }
    th:nth-child(4) { width: 48%; }
    th:last-child, td:last-child { text-align: right; }
    thead { display: table-header-group; }
    tr { break-inside: avoid; page-break-inside: avoid; }
    @media (max-width: 700px) {
      main { width: 100%; margin: 0; }
      section { min-height: 0; padding: 24px 16px; }
      section + section { margin-top: 16px; }
      table { font-size: 11px; }
      th, td { padding: 4px; }
      th:nth-child(1) { width: 24%; }
      th:nth-child(2) { width: 17%; }
      th:nth-child(3) { width: 30%; }
      th:nth-child(4) { width: 29%; }
    }
    @media print {
      @page { size: Letter; margin: 0.57in; }
      body { background: #fff; }
      main { width: auto; margin: 0; max-width: none; }
      section { min-height: 0; padding: 0; }
      section + section { margin: 0; break-before: page; page-break-before: always; }
    }
  </style>
</head>
<body>
  <main>
    <!-- Insert the completed five-paragraph Executive Summary here. -->
    <section id="executive-summary">
      <h1>C. Executive Summary</h1>
      {{ executive_summary_html }}
    </section>
    <!-- Insert the completed introduction, numbered themes, tables, and recommendations here. -->
    <section id="security-analysis">
      <h1>F. Security Analysis</h1>
      {{ security_analysis_html }}
    </section>
  </main>
</body>
</html>
